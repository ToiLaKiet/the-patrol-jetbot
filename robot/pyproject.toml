[project]
name = "patrol-jetbot-robot"
version = "0.1.0"
requires-python = ">=3.8,<3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
    "rospkg",
    "pygame>=2.6.1,<3",
    "traitlets",
    "jetbot; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
jetbot = { git = "https://github.com/NVIDIA-AI-IOT/jetbot.git", tag = "v0.4.3" }

# Match upstream setup.py so locking on development machines does not run Jetson's native build.
[[tool.uv.dependency-metadata]]
name = "jetbot"
version = "0.4.3"
requires-dist = ["Adafruit-MotorHAT", "Adafruit-SSD1306"]

# Install torch, torchvision, efficientnet-pytorch, and warmup-scheduler separately for the Jetson's JetPack version.
# Generic PyPI wheels may not support the Jetson GPU.
